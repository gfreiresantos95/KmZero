<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="KmZero">
  <!-- Sem o círculo: o mesmo tratamento do logotipo, reduzido às
       letras que cabem em 16px.
       Hex fixo por necessidade — SVG externo não enxerga os tokens.
       Cores: --cor-primaria-600 (#0C6070) e --cor-texto-invertido. -->
  <rect width="64" height="64" rx="14" fill="#0C6070"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="800" letter-spacing="-2" fill="#FFFFFF">km</text>
</svg>
